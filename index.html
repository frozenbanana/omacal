<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omacal</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg, #2e3440);
        color: var(--fg, #d8dee9);
        font-family: "JetBrains Mono", "Iosevka", "Cascadia Code", ui-monospace, monospace;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--bg, #2e3440);
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.25s ease;
      }
      .splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-icon {
        width: 72px;
        height: 72px;
        color: var(--accent, #81a1c1);
        animation: omacal-pulse 1.1s ease-in-out infinite;
      }
      @keyframes omacal-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.12);
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-icon {
          animation: none;
        }
      }
    </style>
    <script src="/theme-seed.js"></script>
  </head>

  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <svg
        class="splash-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
